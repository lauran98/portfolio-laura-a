# Builds the site and publishes it to GitHub Pages.
#
# This runs automatically every time you push to the `main` branch — including
# when you edit a file directly on github.com. You never have to run it by hand,
# though the "Run workflow" button on the Actions tab will do so if you want.
#
# One-time setup (already done if the site is live): in the repository's
# Settings → Pages, set "Source" to "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Lets this workflow publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the second build finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
